<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Further Lead Form</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #1f2937; }
    main { max-width: 560px; margin: 48px auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid #c9ced6; border-radius: 7px; font: inherit; }
    button { margin-top: 22px; padding: 11px 16px; border: 0; border-radius: 7px; font: inherit; font-weight: 700; cursor: pointer; }
    button[disabled] { cursor: wait; opacity: .65; }
    #status { margin-top: 18px; padding: 12px; border-radius: 7px; display: none; }
    #status.success { display: block; background: #eaf7ed; color: #17632c; }
    #status.error { display: block; background: #fdecec; color: #8c1d18; }
    .hint { color: #6b7280; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Submit a Lead</h1>
    <p class="hint">All fields are required.</p>

    <form id="lead-form" novalidate>
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" autocomplete="given-name" />

      <label for="last_name">Last name</label>
      <input id="last_name" name="last_name" autocomplete="family-name" />

      <label for="email">Email</label>
      <input id="email" name="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" autocomplete="tel" placeholder="817-555-0123" />

      <button type="submit">Submit lead</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('lead-form');
    const button = form.querySelector('button');
    const status = document.getElementById('status');

    function showStatus(type, message) {
      status.className = type;
      status.textContent = message;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      showStatus('', '');

      try {
        const body = new URLSearchParams(new FormData(form));
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
        });

        const result = await response.json();

        if (!response.ok) {
          showStatus('error', result.message || 'Submission failed.');
          return;
        }

        const id = result.lead?.further_lead_id;
        showStatus('success', id ? `Lead submitted successfully. Further lead ID: ${id}` : 'Lead submitted successfully.');
        form.reset();
      } catch {
        showStatus('error', 'Something went wrong while submitting. Please try again.');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
